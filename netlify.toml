# Full app mode: static frontend + Express backend as a Netlify function.
[build]
  publish = "public"
  functions = "netlify/functions"

# Backend API — the Express app runs as a Netlify function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Daily digest scheduler lives in netlify/functions/digest.mts (@daily).
